<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .grid-line { stroke: #334155; stroke-width: 0.5; opacity: 0.4; }
      .pulse-circle { fill: none; stroke: #818cf8; stroke-width: 1.5; opacity: 0.6; }
      .node { fill: #38bdf8; }
      .edge { stroke: #6366f1; stroke-width: 1.5; opacity: 0.5; stroke-dasharray: 6 4; }

      @keyframes scan {
        0% { transform: translateY(-10px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(310px); opacity: 0; }
      }
      @keyframes pulse {
        0% { r: 15px; opacity: 0.8; }
        100% { r: 65px; opacity: 0; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }

      .scan-line { animation: scan 4s linear infinite; }
      .expanding-ring { animation: pulse 3s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .animated-edge { animation: dash 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12" />

  <!-- Background Grid -->
  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="300" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="300" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Cyber/Graph Background Elements (Kept Low Opacity/Background) -->
  <g opacity="0.35">
    <!-- Graph Edges -->
    <line x1="100" y1="80" x2="250" y2="220" class="edge animated-edge" />
    <line x1="250" y1="220" x2="400" y2="70" class="edge animated-edge" />
    <line x1="950" y1="70" x2="1080" y2="210" class="edge animated-edge" />
    <line x1="800" y1="230" x2="950" y2="70" class="edge animated-edge" />

    <!-- Graph Nodes -->
    <circle cx="100" cy="80" r="5" class="node" />
    <circle cx="250" cy="220" r="6" class="node" />
    <circle cx="400" cy="70" r="5" class="node" />
    <circle cx="950" cy="70" r="6" class="node" />
    <circle cx="1080" cy="210" r="5" class="node" />
    <circle cx="800" cy="230" r="5" class="node" />

    <!-- Pulsing Radar / Scan effect at side -->
    <circle cx="1050" cy="150" r="20" class="pulse-circle expanding-ring" />
    <circle cx="150" cy="150" r="20" class="pulse-circle expanding-ring" style="animation-delay: 1.5s;" />
  </g>

  <!-- Scanning Line Effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="scan-line" filter="url(#glow)" />

  <!-- Main Banner Header Box (Solid/Glow Background Behind Text to Prevent Obscuration) -->
  <rect x="150" y="50" width="900" height="200" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />

  <!-- Shield / Lock Security Icon -->
  <g transform="translate(600, 95)">
    <!-- Centered Security Badge -->
    <path d="M 0 -28 L 22 -14 L 22 10 C 22 24 0 34 0 34 C 0 34 -22 24 -22 10 L -22 -14 Z" fill="url(#accentGrad)" opacity="0.9" />
    <path d="M 0 -22 L 17 -10 L 17 8 C 17 19 0 27 0 27 C 0 27 -17 19 -17 8 L -17 -10 Z" fill="#0f172a" />
    <circle cx="0" cy="-2" r="4" fill="#38bdf8" />
    <path d="M -2 0 L 2 0 L 3 8 L -3 8 Z" fill="#38bdf8" />
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="600" y="165" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Awesome Identity Threat Detection &amp; Response
  </text>
  
  <text x="600" y="205" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    🛡️ Curated ITDR Tools, Active Directory Attack Path Analysis &amp; Cloud Identity Security
  </text>
</svg>
