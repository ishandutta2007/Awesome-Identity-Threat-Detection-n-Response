<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="300" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes scan{0%{transform:translateY(-10px);opacity:0}50%{opacity:.8}}@keyframes pulse{0%{r:15px;opacity:.8}}.grid-line{stroke:#334155;stroke-width:.5;opacity:.4}.pulse-circle{fill:none;stroke:#818cf8;stroke-width:1.5;opacity:.6}.node{fill:#38bdf8}.edge{stroke:#6366f1;stroke-width:1.5;opacity:.5;stroke-dasharray:6 4}.scan-line{animation:scan 4s linear infinite}.expanding-ring{animation:pulse 3s cubic-bezier(0,.2,.8,1) infinite}.animated-edge{animation:dash 1.5s linear infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="12"/><g class="grid"><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="150" x2="150" y1="0" y2="300" class="grid-line"/><line x1="300" x2="300" y1="0" y2="300" class="grid-line"/><line x1="450" x2="450" y1="0" y2="300" class="grid-line"/><line x1="600" x2="600" y1="0" y2="300" class="grid-line"/><line x1="750" x2="750" y1="0" y2="300" class="grid-line"/><line x1="900" x2="900" y1="0" y2="300" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="300" class="grid-line"/></g><g opacity=".35"><line x1="100" x2="250" y1="80" y2="220" class="edge anim